147831", "type": "COVERS", "value": 1}, {"source": "func_mesx-quality-api::probes.controller::getHello", "target": "uc_UC_148387", "type": "COVERS", "value": 1}, {"source": "func_mesx-quality-api::rework-list.controller::UseFilters", "target": "uc_UC_147831", "type": "COVERS", "value": 1}, {"source": "func_mesx-resource-api::probes.controller::getHello", "target": "uc_UC_148387", "type": "COVERS", "value": 1}, {"source": "func_mesx-resource-api::shift-tracking.controller::getBalancingOptions", "target": "uc_UC_147422", "type": "COVERS", "value": 1}, {"source": "func_mesx-resource-api::shift-tracking.controller::getBalancingOptions", "target": "uc_UC_146614", "type": "COVERS", "value": 1}, {"source": "func_mesx-resource-api::shift-tracking.controller::validateBalancingRange", "target": "uc_UC_146614", "type": "COVERS", "value": 1}, {"source": "func_mesx-transfer-api::probes.controller::getHello", "target": "uc_UC_148387", "type": "COVERS", "value": 1}, {"source": "func_mesx-transfer-api::transfer.controller::create", "target": "uc_UC_148537", "type": "COVERS", "value": 1}, {"source": "func_mesx-ume-backend::auth.controller::ApiOperation", "target": "uc_UC_147831", "type": "COVERS", "value": 1}, {"source": "func_mesx-ume-backend::homepage-shortcuts.controller::create", "target": "uc_UC_148537", "type": "COVERS", "value": 1}]
        };

        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links)
                .id(d => d.id)
                .distance(d => {
                    if (d.type === "API_CALLS") return 80;
                    if (d.type === "IMPLEMENTS") return 100;
                    return 120;
                })
                .strength(0.2))
            .force("charge", d3.forceManyBody()
                .strength(-500)
                .distanceMax(500))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide(15));

        // Créer les liens
        const link = g.selectAll("line")
            .data(data.links)
            .enter()
            .append("line")
            .attr("class", d => `link ${d.type}`)
            .attr("stroke-width", d => {
                if (d.type === "API_CALLS") return Math.sqrt(d.value);
                return 1;
            });

        // Créer les nœuds
        const nodeElements = g.selectAll("circle")
            .data(data.nodes)
            .enter()
            .append("circle")
            .attr("class", "node")
            .attr("r", d => {
                if (d.type === "Microservice") return 12;
                if (d.type === "Function") return 8;
                return 6;
            })
            .attr("fill", d => {
                if (d.type === "Microservice") return "#ff6b6b";
                if (d.type === "Function") return "#4ecdc4";
                return "#45b7d1";
            })
            .call(drag(simulation))
            .on("click", (event, d) => selectNode(d, event))
            .on("mouseover", (event, d) => showTooltip(event, d))
            .on("mouseout", hideTooltip);

        // Labels
        const labels = g.selectAll(".node-label")
            .data(data.nodes)
            .enter()
            .append("text")
            .attr("class", "node-label")
            .attr("dy", -8)
            .text(d => d.name.substring(0, 15));

        // Zoom
        svg.call(d3.zoom()
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            }));

        // Mise à jour des positions
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            nodeElements
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

            labels
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });

        function selectNode(d, event) {
            nodeElements.classed("selected", false);
            link.classed("highlighted", false);
            labels.classed("visible", false);

            d3.select(event.target).classed("selected", true);
            labels.filter(label => label.id === d.id).classed("visible", true);

            link.classed("highlighted", l => 
                l.source.id === d.id || l.target.id === d.id
            );

            showInfoPanel(d);
        }

        function showInfoPanel(d) {
            const panel = document.getElementById("info-panel");
            const title = document.getElementById("info-title");
            const content = document.getElementById("info-content");
            
            title.textContent = `${d.type}: ${d.name}`;
            
            let info = "";
            if (d.type === "Microservice") {
                info = `Projet: ${d.project}<br/>Relations: ${data.links.filter(l => l.source.id === d.id || l.target.id === d.id).length}`;
            } else if (d.type === "Function") {
                info = `Microservice: ${d.microservice}<br/>Path: ${d.path || "N/A"}`;
            } else {
                info = `Priorité: ${d.priorite || "Normal"}<br/>Area: ${d.area_path || "N/A"}`;
            }
            
            content.innerHTML = info;
            panel.classList.remove("hidden");
        }

        function showTooltip(event, d) {
            const tooltip = document.getElementById("tooltip");
            const outgoing = data.links.filter(l => l.source.id === d.id).length;
            const incoming = data.links.filter(l => l.target.id === d.id).length;
            
            let html = `<strong style="color: #00d4ff;">${d.name}</strong><br/>Type: ${d.type}<br/>`;
            html += `📤 Out: ${outgoing}<br/>📥 In: ${incoming}`;
            
            tooltip.innerHTML = html;
            tooltip.style.display = 'block';
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY + 15) + 'px';
        }

        function hideTooltip() {
            document.getElementById("tooltip").style.display = 'none';
        }

        function drag(simulation) {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        // Recherche
        document.getElementById("search").addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase();
            nodeElements.classed("highlight", d => 
                d.name.toLowerCase().includes(query)
            );
        });
    </script>
