<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commit Analysis - FORVIA NRT Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --forvia-blue: #0033CC;
            --forvia-dark: #001a99;
            --forvia-light: #e6f0ff;
            --gray-dark: #1a1a1a;
            --gray-light: #f8f9fa;
            --accent: #FF6B35;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: var(--gray-dark);
        }

        .navbar {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0, 51, 204, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: white;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .navbar-brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .navbar-brand-text .primary {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .navbar-brand-text .secondary {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.95;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .nav-links a:hover::after { width: 100%; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 36px;
            color: var(--forvia-dark);
            margin-bottom: 40px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .analysis-panel {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 2px solid var(--forvia-light);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--gray-dark);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--forvia-blue);
            box-shadow: 0 0 0 3px var(--forvia-light);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 51, 204, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-section {
            margin-top: 40px;
        }

        .result-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            border-left: 4px solid var(--forvia-blue);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--forvia-light);
        }

        .result-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--forvia-dark);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-mode {
            background: var(--forvia-light);
            color: var(--forvia-blue);
        }

        .badge-success {
            background: #d1f2eb;
            color: #27AE60;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            padding: 15px;
            background: var(--forvia-light);
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--forvia-blue);
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .functions-list {
            margin-top: 20px;
        }

        .functions-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--gray-dark);
        }

        .function-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--gray-light);
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--forvia-blue);
        }

        .function-icon {
            width: 40px;
            height: 40px;
            background: var(--forvia-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: var(--forvia-blue);
            font-weight: 600;
        }

        .function-info {
            flex: 1;
        }

        .function-name {
            font-weight: 600;
            color: var(--gray-dark);
            margin-bottom: 3px;
        }

        .function-meta {
            font-size: 12px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid var(--forvia-light);
            border-top: 4px solid var(--forvia-blue);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            border-left: 4px solid #E74C3C;
            color: #721c24;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .batch-panel {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 2px solid #dce9ff;
        }

        .batch-title {
            color: var(--forvia-dark);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .batch-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            gap: 14px;
            align-items: end;
        }

        .btn-secondary {
            background: white;
            color: var(--forvia-blue);
            border: 2px solid var(--forvia-blue);
        }

        .batch-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .batch-results {
            margin-top: 20px;
        }

        .table-wrap {
            overflow: auto;
            border: 1px solid #dce9ff;
            border-radius: 10px;
        }

        .mini-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .mini-table th,
        .mini-table td {
            border-bottom: 1px solid #eef3ff;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        .mini-table th {
            background: #f3f7ff;
            color: #0b2a7a;
            font-weight: 700;
        }

        .scope-batch-card {
            background: #fff;
            border: 1px solid #dce9ff;
            border-left: 4px solid var(--forvia-blue);
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
        }

        .scope-batch-title {
            font-weight: 700;
            color: #0b2a7a;
            margin-bottom: 8px;
        }

        .scope-batch-lines {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        /* DATALIST STYLES */
        datalist {
            display: none;
        }

        .form-input::-webkit-calendar-picker-indicator {
            display: none;
        }

        .form-input::placeholder {
            color: #999;
        }

        footer {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .input-grid { grid-template-columns: 1fr; }
            .batch-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <img src="/static/forvia_logo.png" alt="FORVIA Logo" style="height: 70px;">
                <div class="navbar-brand-text">
                    <div class="primary">MESX 0</div>
                    <div class="secondary">NRT</div>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/commit-analysis"><i class="fas fa-code-branch"></i> Analysis</a></li>
                <li><a href="/workitem-scope"><i class="fas fa-tasks"></i> Scope</a></li>
                <li><a href="/graph-visualization"><i class="fas fa-project-diagram"></i> Graph</a></li>
                <li><a href="/reports"><i class="fas fa-chart-bar"></i> Reports</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-title">
            <i class="fas fa-code-branch"></i> Commit Impact Analysis
        </div>

        <div class="analysis-panel">
            <form id="analysisForm">
                <div class="input-grid">
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-git"></i> Commit ID</label>
                        <input type="text" id="commitId" class="form-input" placeholder="ea545bc5ab741dc7d4312cd1b45a251cace3c2dc" list="commitHistory" required>
                        <datalist id="commitHistory"></datalist>
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-tasks"></i> WorkItem ID (Optional)</label>
                        <input type="text" id="workitemId" class="form-input" placeholder="127835 - Leave empty for full impact">
                    </div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-search"></i> Analyze Commit</button>
            </form>
        </div>

        <div class="batch-panel">
            <div class="batch-title"><i class="fas fa-calendar-alt"></i> Batch NRT Scope by Date Range</div>
            <div class="batch-grid">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-calendar-day"></i> Date From</label>
                    <input type="date" id="dateFrom" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-calendar-day"></i> Date To</label>
                    <input type="date" id="dateTo" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-bug"></i> WorkItem Type</label>
                    <select id="batchType" class="form-input">
                        <option value="All">All</option>
                        <option value="Bug">Bug</option>
                        <option value="User Story">User Story</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-link"></i> Date Source</label>
                    <select id="dateSource" class="form-input">
                        <option value="any">Commit OR PR</option>
                        <option value="commit">Commit only</option>
                        <option value="pr">PR only</option>
                    </select>
                </div>
            </div>
            <div class="batch-actions">
                <button class="btn" id="btnFindWorkitems" type="button"><i class="fas fa-filter"></i> Find WorkItems</button>
                <button class="btn btn-secondary" id="btnGenerateBatchScope" type="button"><i class="fas fa-layer-group"></i> Generate NRT Scope (Batch)</button>
            </div>
            <div class="batch-results" id="batchResults"></div>
        </div>

        <div class="results-section" id="results" style="display: none;">
            <div class="result-card">
                <div class="result-header">
                    <span class="result-title"><i class="fas fa-chart-network"></i> Impact Analysis Results</span>
                    <div>
                        <span class="badge badge-mode" id="modeBadge">MODE</span>
                        <span class="badge badge-success"><i class="fas fa-check-circle"></i> Valid</span>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-number" id="functionCount">0</div>
                        <div class="stat-label">Functions</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="workitemCount">0</div>
                        <div class="stat-label">WorkItems</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="microserviceCount">0</div>
                        <div class="stat-label">Microservices</div>
                    </div>
                </div>

                <div class="functions-list">
                    <div class="functions-title"><i class="fas fa-code"></i> Affected Functions</div>
                    <div id="functionsList"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 FORVIA NRT Scope System | <strong>Automated Non-Regression Test Orchestration</strong></p>
    </footer>

    <script>
        // HISTORIQUE DES COMMITS
        function loadCommitHistory() {
            const history = JSON.parse(localStorage.getItem('commitHistory') || '[]');
            const datalist = document.getElementById('commitHistory');
            if (datalist) {
                datalist.innerHTML = history.map(commit => 
                    `<option value="${commit}"></option>`
                ).join('');
            }
        }

        function saveCommitToHistory(commitId) {
            let history = JSON.parse(localStorage.getItem('commitHistory') || '[]');
            if (!history.includes(commitId)) {
                history.unshift(commitId); // Ajouter au début
                history = history.slice(0, 10); // Garder que les 10 derniers
                localStorage.setItem('commitHistory', JSON.stringify(history));
                loadCommitHistory();
            }
        }

        // Charger l'historique au démarrage (when DOM is ready)
        window.addEventListener('DOMContentLoaded', function() {
            loadCommitHistory();
            initDefaultDateRange();
            wireBatchActions();
            
            // Attach form event listener after DOM is ready
            const form = document.getElementById('analysisForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const commitId = document.getElementById('commitId').value;
                    const workitemId = document.getElementById('workitemId').value;
                    
                    // Sauvegarder le commit dans l'historique
                    saveCommitToHistory(commitId);
                    
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing commit...</p></div>';
                    resultsDiv.style.display = 'block';

                    try {
                        const url = `/api/commit/${commitId}${workitemId ? '?workitem=' + workitemId : ''}`;
                        const response = await fetch(url);
                        const data = await response.json();

                        if (!response.ok) {
                            resultsDiv.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-circle"></i> ${data.error || 'Error analyzing commit'}</div>`;
                            return;
                        }

                        displayResults(data);
                    } catch (error) {
                        resultsDiv.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
                    }
                });
            }
        });

        function displayResults(data) {
            const mode = data.workitem_id ? 'SPECIFIC' : 'FULL';
            
            const functionsHtml = data.functions && data.functions.length > 0 
                ? data.functions.map((fn, idx) => `
                    <div class="function-item">
                        <div class="function-icon">${idx + 1}</div>
                        <div class="function-info">
                            <div class="function-name">⚙️ ${fn.name || 'Unknown Function'}</div>
                            <div class="function-meta">Microservice: ${fn.microservice || 'N/A'}</div>
                        </div>
                    </div>
                `).join('')
                : '<p style="color: #999;">No functions found</p>';
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <span class="result-title"><i class="fas fa-chart-network"></i> Impact Analysis Results</span>
                        <div>
                            <span class="badge badge-mode" id="modeBadge">MODE: ${mode}</span>
                            <span class="badge badge-success"><i class="fas fa-check-circle"></i> Valid</span>
                        </div>
                    </div>

                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-number" id="functionCount">${data.function_count || 0}</div>
                            <div class="stat-label">Functions</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="workitemCount">${data.workitem_count || 0}</div>
                            <div class="stat-label">WorkItems</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="microserviceCount">${data.microservice_count || 0}</div>
                            <div class="stat-label">Microservices</div>
                        </div>
                    </div>

                    <div class="functions-list">
                        <div class="functions-title"><i class="fas fa-code"></i> Affected Functions</div>
                        <div id="functionsList">${functionsHtml}</div>
                    </div>
                </div>
            `;
        }

        function initDefaultDateRange() {
            const to = new Date();
            const from = new Date();
            from.setDate(to.getDate() - 14);
            document.getElementById('dateTo').value = to.toISOString().slice(0, 10);
            document.getElementById('dateFrom').value = from.toISOString().slice(0, 10);
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function wireBatchActions() {
            const findBtn = document.getElementById('btnFindWorkitems');
            const scopeBtn = document.getElementById('btnGenerateBatchScope');
            if (findBtn) findBtn.addEventListener('click', loadWorkitemsByDateRange);
            if (scopeBtn) scopeBtn.addEventListener('click', generateBatchScope);
        }

        async function loadWorkitemsByDateRange() {
            const target = document.getElementById('batchResults');
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const type = document.getElementById('batchType').value;
            const dateSource = document.getElementById('dateSource').value;

            if (!dateFrom || !dateTo) {
                target.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please select both dates.</div>';
                return;
            }

            target.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading WorkItems by activity date...</p></div>';
            const query = new URLSearchParams({
                date_from: dateFrom,
                date_to: dateTo,
                type,
                date_source: dateSource,
                limit: '300'
            });

            try {
                const res = await fetch(`/api/workitems-by-activity-date?${query.toString()}`);
                const data = await res.json();
                if (!res.ok || data.error) {
                    target.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(data.error || 'Error loading workitems')}</div>`;
                    return;
                }
                window.__batchWorkitems = data.results || [];
                renderBatchSelection(data);
            } catch (err) {
                target.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-circle"></i> ${escapeHtml(err.message)}</div>`;
            }
        }

        function renderBatchSelection(data) {
            const rows = (data.results || []).map(wi => `
                <tr>
                    <td><input type="checkbox" class="wi-check" value="${wi.id}" checked></td>
                    <td>${wi.id}</td>
                    <td title="${escapeHtml(wi.titre)}">${escapeHtml(wi.titre)}</td>
                    <td>${escapeHtml(wi.type)}</td>
                    <td>${wi.matched_commit_count || 0}</td>
                    <td>${wi.matched_pr_count || 0}</td>
                    <td>${escapeHtml(wi.last_activity_date || '')}</td>
                </tr>
            `).join('');

            const target = document.getElementById('batchResults');
            target.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <span class="result-title"><i class="fas fa-list"></i> WorkItems in selected interval</span>
                        <span class="badge badge-mode">${data.count} shown / ${data.total_found} found</span>
                    </div>
                    <div class="table-wrap">
                        <table class="mini-table">
                            <thead>
                                <tr>
                                    <th>Select</th>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>Commits</th>
                                    <th>PRs</th>
                                    <th>Last activity (UTC)</th>
                                </tr>
                            </thead>
                            <tbody>${rows || '<tr><td colspan="7">No workitems found.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                <div id="batchScopeOutput"></div>
            `;
        }

        async function generateBatchScope() {
            const checks = Array.from(document.querySelectorAll('.wi-check:checked'));
            const output = document.getElementById('batchScopeOutput') || document.getElementById('batchResults');
            if (!checks.length) {
                output.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Select at least one WorkItem.</div>';
                return;
            }
            const ids = checks.map(c => c.value);
            output.innerHTML = '<div class="loading"><div class="spinner"></div><p>Generating NRT scopes...</p></div>';

            const cards = [];
            for (let i = 0; i < ids.length; i++) {
                const wiId = ids[i];
                try {
                    const res = await fetch(`/api/nrt-scope?workitem_id=${encodeURIComponent(wiId)}`);
                    const data = await res.json();
                    if (!res.ok || data.error) {
                        cards.push(`
                            <div class="scope-batch-card">
                                <div class="scope-batch-title">WorkItem ${wiId}</div>
                                <div class="scope-batch-lines">Error: ${escapeHtml(data.error || 'Unable to build scope')}</div>
                            </div>
                        `);
                        continue;
                    }

                    const direct = data.summary?.direct_ms_count ?? 0;
                    const indirect = data.summary?.indirect_ms_count ?? 0;
                    const functions = data.summary?.total_functions ?? 0;
                    const targets = (data.target_retest_from_commit_trace || []).slice(0, 3).map(ms => ms.microservice);
                    const targetText = targets.length ? targets.join(', ') : 'No direct target microservice from commit trace';
                    cards.push(`
                        <div class="scope-batch-card">
                            <div class="scope-batch-title">[${escapeHtml(data.workitem?.type || '')}] ${escapeHtml(data.workitem?.id || wiId)} - ${escapeHtml(data.workitem?.title || '')}</div>
                            <div class="scope-batch-lines">
                                Direct MS: <strong>${direct}</strong> | Indirect MS: <strong>${indirect}</strong> | Functions: <strong>${functions}</strong><br>
                                Retest targets (sample): ${escapeHtml(targetText)}
                            </div>
                        </div>
                    `);
                } catch (err) {
                    cards.push(`
                        <div class="scope-batch-card">
                            <div class="scope-batch-title">WorkItem ${wiId}</div>
                            <div class="scope-batch-lines">Error: ${escapeHtml(err.message)}</div>
                        </div>
                    `);
                }
            }

            output.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <span class="result-title"><i class="fas fa-layer-group"></i> Batch Scope Results (${cards.length} WorkItems)</span>
                        <span class="badge badge-success"><i class="fas fa-check-circle"></i> Generated</span>
                    </div>
                    ${cards.join('')}
                </div>
            `;
        }
    </script>
</body>
</html>
