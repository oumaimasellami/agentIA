<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkItem Scope - FORVIA NRT Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --forvia-blue: #0033CC;
            --forvia-dark: #001a99;
            --forvia-light: #e6f0ff;
            --gray-dark: #1a1a1a;
            --gray-light: #f8f9fa;
            --accent: #FF6B35;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: var(--gray-dark);
        }

        .navbar {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0, 51, 204, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: white;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .navbar-brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .navbar-brand-text .primary {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .navbar-brand-text .secondary {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.95;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .nav-links a:hover::after { width: 100%; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 36px;
            color: var(--forvia-dark);
            margin-bottom: 40px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .generation-panel {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 2px solid var(--forvia-light);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--gray-dark);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--forvia-blue);
            box-shadow: 0 0 0 3px var(--forvia-light);
        }

        .form-input:is(select) {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 35px;
        }

        select:hover {
            border-color: var(--forvia-blue);
        }

        select:focus {
            outline: none;
            border-color: var(--forvia-blue);
            box-shadow: 0 0 0 3px var(--forvia-light);
        }

        .button-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 51, 204, 0.3);
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--forvia-blue);
            border: 2px solid var(--forvia-blue);
        }

        .btn-secondary:hover {
            background: var(--forvia-light);
        }

        .scope-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            border-left: 4px solid var(--forvia-blue);
        }

        .scope-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--forvia-light);
        }

        .scope-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--forvia-dark);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d1f2eb;
            color: #27AE60;
        }

        .scope-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 20px;
            background: var(--forvia-light);
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--forvia-blue);
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .functions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .functions-table thead {
            background: var(--forvia-light);
            border-bottom: 2px solid var(--forvia-blue);
        }

        .functions-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--forvia-dark);
            font-size: 13px;
            text-transform: uppercase;
        }

        .functions-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .functions-table tbody tr:hover {
            background: var(--gray-light);
        }

        /* ========== CHILDREN TO TEST SECTION ========== */
        .children-to-test-section {
            margin-top: 40px;
            padding: 20px;
            background: linear-gradient(135deg, #f0f7ff 0%, #e6f0ff 100%);
            border: 2px solid #3498DB;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(52, 152, 219, 0.15);
        }

        .children-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498DB;
        }

        .children-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: #0033CC;
            margin-bottom: 5px;
        }

        .children-subtitle {
            font-size: 12px;
            color: #555;
            font-style: italic;
            margin: 0;
        }

        .children-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 51, 204, 0.1);
        }

        .children-table thead {
            background: #E8F4F8;
            border-bottom: 2px solid #3498DB;
        }

        .children-table thead th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #0033CC;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .children-table tbody td {
            padding: 12px;
            border-bottom: 1px solid #E0E0E0;
            font-size: 13px;
            color: #333;
        }

        .children-table tbody tr {
            transition: all 0.2s ease;
        }

        .children-table tbody tr:hover {
            background: #F5F9FF;
            box-shadow: inset 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .children-table tbody tr:last-child td {
            border-bottom: none;
        }

        .priority-badge {
            display: inline-block;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
            border-radius: 3px;
        }

        .status-badge {
            display: inline-block;
            white-space: nowrap;
            border-radius: 3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .export-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--forvia-light);
        }

        .export-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-dark);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        .export-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--forvia-blue);
            background: white;
            color: var(--forvia-blue);
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .export-btn:hover {
            background: var(--forvia-light);
        }

        /* DATALIST STYLES */
        datalist {
            display: none;
        }

        .form-input::placeholder {
            color: #999;
        }

        footer {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .button-group { flex-direction: column; }
            .page-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <img src="/static/forvia_logo.png" alt="FORVIA Logo" style="height: 70px;">
                <div class="navbar-brand-text">
                    <div class="primary">MESX 0</div>
                    <div class="secondary">NRT</div>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/commit-analysis"><i class="fas fa-code-branch"></i> Analysis</a></li>
                <li><a href="/workitem-scope"><i class="fas fa-tasks"></i> Scope</a></li>
                <li><a href="/graph-visualization"><i class="fas fa-project-diagram"></i> Graph</a></li>
                <li><a href="/reports"><i class="fas fa-chart-bar"></i> Reports</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-title">
            <i class="fas fa-tasks"></i> NRT Scope Analyzer (WorkItem Only)
        </div>

        <div class="generation-panel">
            <form id="scopeForm" onsubmit="analyzeWorkitem(event)">
                <div style="display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; align-items: end;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label"><i class="fas fa-filter"></i> Type</label>
                        <select id="workitemType" class="form-input" onchange="loadWorkItemsByType(this.value)">
                            <option value="">-- Select Type --</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label"><i class="fas fa-tasks"></i> WorkItem ID</label>
                        <input type="text" id="workitemId" class="form-input" placeholder="141432" required>
                    </div>
                    <div class="button-group" style="margin: 0;">
                        <button type="submit" class="btn"><i class="fas fa-cogs"></i> Analyze</button>
                        <button type="reset" class="btn btn-secondary"><i class="fas fa-redo"></i> Clear</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Filter Results Table -->
        <div id="filterResultsContainer" style="display: none; margin: 30px 0;">
            <div class="scope-card">
                <div class="scope-header">
                    <div class="scope-title" id="filterTitle">Available IDs</div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="filterResultsTable" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%); color: white;">
                                <th style="padding: 12px; text-align: left; font-weight: 600;">ID</th>
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Titre</th>
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Statut</th>
                                <th style="padding: 12px; text-align: left; font-weight: 600;">Priorité</th>
                                <th style="padding: 12px; text-align: center; font-weight: 600;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="filterResultsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" style="display: none; background: white; padding: 40px; border-radius: 12px; text-align: center; margin: 30px 0; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);">
            <div style="border: 4px solid var(--forvia-light); border-top: 4px solid var(--forvia-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
            <p style="color: var(--gray-dark);">Analyzing NRT scope from Neo4j...</p>
        </div>

        <!-- Error Message -->
        <div id="error" style="display: none; background: #fee; border-left: 4px solid #c62828; color: #c62828; padding: 15px 20px; border-radius: 6px; margin: 20px 0;"></div>

        <!-- Results -->
        <div id="scopeResults"></div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        function analyzeWorkitem(event) {
            event.preventDefault();
            const workitemType = document.getElementById('workitemType').value.trim();
            const workitemId = document.getElementById('workitemId').value.trim();
            
            if (!workitemType) {
                showError('Please select a WorkItem Type (User Story or Bug)');
                return;
            }
            
            if (!workitemId) {
                showError('Please enter a WorkItem ID');
                return;
            }
            
            if (!/^\d+$/.test(workitemId)) {
                showError('WorkItem ID must be a number');
                return;
            }
            
            showLoading(true);
            
            fetch(`/api/nrt-scope?workitem_id=${workitemId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showError(data.error);
                    } else if (data.workitem.type !== workitemType) {
                        showError(`WorkItem type mismatch! Expected ${workitemType}, but got ${data.workitem.type}`);
                    } else {
                        showError('');
                        renderResults(data);
                    }
                })
                .catch(error => {
                    showError(`Network error: ${error.message}`);
                })
                .finally(() => showLoading(false));
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            if (message) {
                errorDiv.textContent = `❌ ${message}`;
                errorDiv.style.display = 'block';
            } else {
                errorDiv.style.display = 'none';
            }
        }
        
        function renderResults(data) {
            const wi = data.workitem;
            const summary = data.summary;
            
            let html = `
                <div class="scope-card">
                    <div class="scope-header">
                        <div>
                            <div class="scope-title">#${wi.id} - ${wi.title}</div>
                            <div style="font-size: 12px; color: #666; margin-top: 5px;">Type: <strong>${wi.type}</strong></div>
                        </div>
                        <span class="badge badge-success">✓ Analysis Complete</span>
                    </div>
                    
                    <div class="scope-stats">
                        <div class="stat-box">
                            <div class="stat-value">${summary.direct_ms_count}</div>
                            <div class="stat-label">Direct MS</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${summary.indirect_ms_count}</div>
                            <div class="stat-label">Indirect MS</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${summary.total_ms_count}</div>
                            <div class="stat-label">Total MS</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${summary.total_functions}</div>
                            <div class="stat-label">Functions</div>
                        </div>
                    </div>
                </div>
                
                <!-- DIRECT MICROSERVICES -->
                <div class="scope-card">
                    <div class="scope-header">
                        <div class="scope-title">✅ Direct Microservices (${summary.direct_ms_count})</div>
                    </div>
                    ${renderMicroservicesTable(data.direct_microservices, 'direct')}
                </div>
                
                <!-- INDIRECT MICROSERVICES -->
                <div class="scope-card">
                    <div class="scope-header">
                        <div class="scope-title">🔗 Indirect Microservices (${summary.indirect_ms_count})</div>
                    </div>
                    ${renderMicroservicesTable(data.indirect_microservices, 'indirect')}
                </div>
            `;
            
            document.getElementById('scopeResults').innerHTML = html;
        }
        
        function renderMicroservicesTable(microservices, type) {
            if (!microservices || microservices.length === 0) {
                return '<p style="color: #999; padding: 20px;">No microservices found</p>';
            }
            
            let html = '<table class="functions-table"><thead><tr>';
            
            if (type === 'direct') {
                html += '<th>Microservice</th><th>Type</th><th>Functions</th>';
            } else {
                html += '<th>Microservice</th><th>Dependency Via</th><th>Source MS</th><th>Functions</th>';
            }
            
            html += '</tr></thead><tbody>';
            
            microservices.forEach(ms => {
                if (type === 'direct') {
                    html += `<tr>
                        <td><strong>${ms.name}</strong></td>
                        <td><span class="badge" style="background: #d1f2eb; color: #27AE60;">${ms.type}</span></td>
                        <td>${ms.function_count}</td>
                    </tr>`;
                } else {
                    html += `<tr>
                        <td><strong>${ms.name}</strong></td>
                        <td><span class="badge" style="background: #fff3e0; color: #e65100;">${ms.dependency_type}</span></td>
                        <td><code>${ms.source_microservice}</code></td>
                        <td>${ms.function_count}</td>
                    </tr>`;
                }
                
                if (ms.functions && ms.functions.length > 0) {
                    html += `<tr style="background: #f9f9f9;">
                        <td colspan="${type === 'direct' ? 3 : 4}">
                            <div style="padding: 10px 0; margin-left: 15px; font-size: 12px; color: #666;">`;
                    
                    ms.functions.forEach(fn => {
                        html += `<div style="padding: 4px 0;"><code>→ ${fn.name}</code></div>`;
                    });
                    
                    html += `</div></td></tr>`;
                }
            });
            
            html += '</tbody></table>';
            return html;
        }
    </script>

    <footer>
        <p>&copy; 2026 FORVIA NRT Scope System | <strong>Automated Non-Regression Test Orchestration</strong></p>
    </footer>

    <script>
        // Load commit history on page load
        function loadCommitHistory() {
            const history = JSON.parse(localStorage.getItem('commitHistory') || '[]');
            const datalist = document.getElementById('commitHistory');
            if (datalist) {
                datalist.innerHTML = history.map(commitId => `<option value="${commitId}"></option>`).join('');
            }
        }

        function saveCommitToHistory(commitId) {
            if (!commitId || commitId.trim() === '') return;
            let history = JSON.parse(localStorage.getItem('commitHistory') || '[]');
            
            // Remove if already exists (to move to front)
            history = history.filter(id => id !== commitId);
            
            // Add to front
            history.unshift(commitId);
            
            // Keep only last 10 commits
            history = history.slice(0, 10);
            
            // Save back to localStorage
            localStorage.setItem('commitHistory', JSON.stringify(history));
            
            // Update datalist display
            loadCommitHistory();
        }

        // Load history when DOM is ready
        window.addEventListener('DOMContentLoaded', function() {
            loadCommitHistory();
            
            // Attach form event listener after DOM is ready
            const form = document.getElementById('scopeForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const commitId = document.getElementById('commitId').value;
                    const workitemId = document.getElementById('workitemId').value;
                    
                    // Save commit to history BEFORE API call
                    saveCommitToHistory(commitId);
                    
                    const resultsDiv = document.getElementById('scopeResults');
                    resultsDiv.innerHTML = '<div style="text-align: center; padding: 40px;"><div style="border: 4px solid var(--forvia-light); border-top: 4px solid var(--forvia-blue); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div><p>Generating scope from Commit + WorkItem...</p></div>';

                    try {
                        const url = `/api/commit/${commitId}?workitem=${workitemId}`;
                        const response = await fetch(url);
                        const data = await response.json();

                        if (!response.ok) {
                            resultsDiv.innerHTML = `<div style="background: #f8d7da; border-left: 4px solid #E74C3C; color: #721c24; padding: 15px 20px; border-radius: 8px;"><i class="fas fa-exclamation-circle"></i> ${data.error || 'Error generating scope'}</div>`;
                            return;
                        }

                        displayScope(data, commitId);
                    } catch (error) {
                        resultsDiv.innerHTML = `<div style="background: #f8d7da; border-left: 4px solid #E74C3C; color: #721c24; padding: 15px 20px; border-radius: 8px;"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
                    }
                });
            }
        });

        function displayScope(data, commitId) {
            const resultsDiv = document.getElementById('scopeResults');
            const functionsHtml = (data.functions || []).map(fn => `
                <tr>
                    <td><i class="fas fa-code"></i> <strong>${fn.name || 'Unknown'}</strong></td>
                    <td><i class="fas fa-cube"></i> ${fn.microservice || 'N/A'}</td>
                    <td><span class="badge badge-success"><i class="fas fa-check"></i> Covered</span></td>
                </tr>
            `).join('');
            
            // Children section HTML
            const childrenHtml = (data.children_to_test || []).length > 0 ? `
                <div class="children-to-test-section">
                    <div class="children-header">
                        <h3><i class="fas fa-tasks"></i> Test Cases à Exécuter (${data.children_count || 0})</h3>
                        <p class="children-subtitle">Enfants du WorkItem Parent - Validation Requise</p>
                    </div>
                    
                    <table class="children-table">
                        <thead>
                            <tr>
                                <th><i class="fas fa-id-badge"></i> Test ID</th>
                                <th><i class="fas fa-file-alt"></i> Titre</th>
                                <th><i class="fas fa-tag"></i> Type</th>
                                <th><i class="fas fa-signal"></i> Priorité</th>
                                <th><i class="fas fa-check-square"></i> Statut</th>
                                <th><i class="fas fa-user"></i> Assigné</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(data.children_to_test || []).map(child => {
                                const priorityColor = {1: '#E74C3C', 2: '#F39C12', 3: '#3498DB', 4: '#95A5A6'}[child.priorite] || '#95A5A6';
                                const statusBg = {
                                    'Validated': '#27AE60',
                                    'Ready': '#2980B9',
                                    'Ready for Auto': '#16A085',
                                    'Draft': '#95A5A6',
                                    'In Progress': '#F39C12',
                                    'Pending': '#E67E22',
                                    'Done': '#27AE60',
                                    'Repair': '#E74C3C'
                                }[child.statut] || '#95A5A6';
                                
                                return `
                                <tr>
                                    <td><span class="badge" style="background: var(--forvia-light); color: var(--forvia-blue);">${child.id}</span></td>
                                    <td><strong>${child.titre}</strong></td>
                                    <td><span class="badge" style="background: #E8F4F8;">
                                        <i class="fas fa-${child.type === 'Test Case' ? 'flask' : 'tasks'}"></i> ${child.type}
                                    </span></td>
                                    <td><span class="priority-badge" style="background: ${priorityColor}; color: white; padding: 4px 8px; border-radius: 3px; font-size: 12px; font-weight: bold;">P${child.priorite}</span></td>
                                    <td><span class="status-badge" style="background: ${statusBg}; color: white; padding: 4px 8px; border-radius: 3px; font-size: 11px;">${child.statut}</span></td>
                                    <td><small>${child.assigne_a || 'N/A'}</small></td>
                                </tr>
                            `}).join('')}
                        </tbody>
                    </table>
                </div>
            ` : '';

            const modeDisplay = data.workitem_id ? `SPECIFIC (WorkItem ${data.workitem_id})` : `FULL IMPACT`;
            const workitemDisplay = data.workitem_id ? `WorkItem ${data.workitem_id}` : `All WorkItems (${data.workitem_count})`;

            resultsDiv.innerHTML = `
                <div class="scope-card">
                    <div class="scope-header">
                        <span class="scope-title"><i class="fas fa-folder-open"></i> NRT Scope: Commit ${commitId.substring(0, 8)}... → ${workitemDisplay}</span>
                        <div>
                            <span class="badge" style="background: var(--forvia-light); color: var(--forvia-blue); margin-right: 10px;"><i class="fas fa-tag"></i> ${modeDisplay}</span>
                            <span class="badge badge-success"><i class="fas fa-check-circle"></i> Complete</span>
                        </div>
                    </div>

                    <div class="scope-stats">
                        <div class="stat-box">
                            <div class="stat-value">${data.function_count || 0}</div>
                            <div class="stat-label">Functions</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.microservice_count || 0}</div>
                            <div class="stat-label">Microservices</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.workitem_count || 0}</div>
                            <div class="stat-label">WorkItems</div>
                        </div>
                        ${data.children_count ? `<div class="stat-box">
                            <div class="stat-value">${data.children_count}</div>
                            <div class="stat-label">Tests Enfants</div>
                        </div>` : ''}
                    </div>

                    <table class="functions-table">
                        <thead>
                            <tr>
                                <th><i class="fas fa-code"></i> Function</th>
                                <th><i class="fas fa-cube"></i> Microservice</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${functionsHtml || '<tr><td colspan="3" style="text-align: center; color: #999;">No functions found</td></tr>'}
                        </tbody>
                    </table>
                    
                    ${childrenHtml}

                    <div class="export-section">
                        <div class="export-title"><i class="fas fa-download"></i> Export Scope</div>
                        <div class="export-buttons">
                            <button class="export-btn" onclick="exportData('json')"><i class="fas fa-file-code"></i> JSON</button>
                            <button class="export-btn" onclick="exportData('csv')"><i class="fas fa-file-csv"></i> CSV</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportData(format) {
            alert(`Export as ${format.toUpperCase()} - Feature coming soon!`);
        }

        // Load WorkItem Types on page load
        window.addEventListener('DOMContentLoaded', function() {
            fetch('/api/workitem-types')
                .then(response => response.json())
                .then(data => {
                    const typeSelect = document.getElementById('workitemType');
                    typeSelect.innerHTML = '<option value="">-- Select Type --</option>';
                    
                    if (data.types) {
                        data.types.forEach(type => {
                            const option = document.createElement('option');
                            option.value = type.name;
                            option.textContent = `${type.name} (${type.count})`;
                            typeSelect.appendChild(option);
                        });
                    }
                })
                .catch(error => console.error('Error loading types:', error));
        });

        // Load WorkItems by type
        function loadWorkItemsByType(typeName) {
            if (!typeName) {
                document.getElementById('filterResultsContainer').style.display = 'none';
                return;
            }

            fetch(`/api/workitems-by-type/${encodeURIComponent(typeName)}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('filterResultsContainer');
                    const title = document.getElementById('filterTitle');
                    const tbody = document.getElementById('filterResultsBody');

                    title.innerHTML = `<i class="fas fa-list"></i> ${typeName} (${data.count} résultats)`;
                    tbody.innerHTML = '';

                    if (data.results && data.results.length > 0) {
                        data.results.forEach(item => {
                            const row = tbody.insertRow();
                            row.style.borderBottom = '1px solid #eee';
                            row.onmouseover = function() { this.style.background = '#f8f9fa'; };
                            row.onmouseout = function() { this.style.background = 'white'; };

                            row.innerHTML = `
                                <td style="padding: 12px; font-weight: 600; color: var(--forvia-blue);">${item.id}</td>
                                <td style="padding: 12px; color: #333;">${item.titre}</td>
                                <td style="padding: 12px;">
                                    <span style="background: #${item.statut === 'Done' ? '27AE60' : item.statut === 'In Progress' ? 'F39C12' : '95A5A6'}15; color: #${item.statut === 'Done' ? '27AE60' : item.statut === 'In Progress' ? 'F39C12' : '95A5A6'}; padding: 4px 12px; border-radius: 4px; font-size: 12px;">
                                        ${item.statut}
                                    </span>
                                </td>
                                <td style="padding: 12px; color: #666;">${item.priorite || '-'}</td>
                                <td style="padding: 12px; text-align: center;">
                                    <button onclick="selectWorkItem(${item.id})" style="padding: 6px 12px; background: var(--forvia-blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
                                        <i class="fas fa-check"></i> Select
                                    </button>
                                </td>
                            `;
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="5" style="padding: 20px; text-align: center; color: #999;">Aucun WorkItem trouvé</td></tr>';
                    }

                    container.style.display = 'block';
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Error loading WorkItems');
                });
        }

        // Select WorkItem from filtered list
        function selectWorkItem(workitemId) {
            document.getElementById('workitemId').value = workitemId;
            document.getElementById('scopeForm').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
