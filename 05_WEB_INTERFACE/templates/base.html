<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FORVIA NRT Platform{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --forvia-blue: #0033CC;
            --forvia-dark: #001a99;
            --forvia-light: #e6f0ff;
            --gray-dark: #1a1a1a;
            --gray-light: #f8f9fa;
            --accent: #FF6B35;
            --success: #27AE60;
            --warning: #F39C12;
            --danger: #E74C3C;
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: var(--gray-dark);
            line-height: 1.6;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0, 51, 204, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: white;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand img {
            height: 30px;
            width: auto;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--accent);
            transition: width 0.3s;
            border-radius: 2px;
        }

        .nav-links a:hover { transform: translateY(-2px); }
        .nav-links a:hover::after { width: 100%; }

        /* CONTAINER */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* SECTION TITLE */
        .section-title {
            font-size: 32px;
            color: var(--forvia-dark);
            margin-bottom: 40px;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--accent) 100%);
            border-radius: 2px;
        }

        /* CARDS */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 51, 204, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0, 51, 204, 0.15);
            border-color: var(--forvia-light);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--accent) 100%);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 51, 204, 0.3);
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--forvia-blue);
            border: 2px solid var(--forvia-blue);
        }

        .btn-secondary:hover {
            background: var(--forvia-light);
        }

        .btn-success {
            background: linear-gradient(90deg, var(--success) 0%, #1e8449 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.3);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        /* FORMS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gray-dark);
            font-size: 14px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--forvia-blue);
            box-shadow: 0 0 0 3px var(--forvia-light);
        }

        /* ALERT MESSAGES */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.3s ease;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--danger);
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid var(--forvia-blue);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* GRID LAYOUTS */
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; }

        /* TAGS & BADGES */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-blue {
            background: var(--forvia-light);
            color: var(--forvia-blue);
        }

        .badge-green {
            background: #d1f2eb;
            color: var(--success);
        }

        .badge-orange {
            background: #fdeee1;
            color: var(--accent);
        }

        /* LOADING SPINNER */
        .spinner {
            border: 3px solid var(--forvia-light);
            border-top: 3px solid var(--forvia-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .nav-links { gap: 15px; }
            .grid-2 { grid-template-columns: 1fr; }
            .container { padding: 20px 15px; }
            .section-title { font-size: 24px; }
        }

        /* FOOTER */
        footer {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 13px;
        }

        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <i class="fas fa-cube"></i> FORVIA NRT
            </div>
            <ul class="nav-links">
                <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/commit-analysis"><i class="fas fa-code-branch"></i> Analysis</a></li>
                <li><a href="/workitem-scope"><i class="fas fa-tasks"></i> Scope</a></li>
                    <li><a href="/graph-visualization"><i class="fas fa-project-diagram"></i> Detailed Scope</a></li>
                    <li><a href="/reports"><i class="fas fa-chart-bar"></i> Functional Scope</a></li>
            </ul>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
        <p>&copy; 2025 FORVIA NRT Scope System | <strong>Automated Non-Regression Test Orchestration</strong></p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
