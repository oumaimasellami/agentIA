<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkItem Scope - FORVIA NRT Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --forvia-blue: #0033CC;
            --forvia-dark: #001a99;
            --forvia-light: #e6f0ff;
            --gray-dark: #1a1a1a;
            --gray-light: #f8f9fa;
            --accent: #FF6B35;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: var(--gray-dark);
        }

        .navbar {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0, 51, 204, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: white;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .nav-links a:hover::after { width: 100%; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 36px;
            color: var(--forvia-dark);
            margin-bottom: 40px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .generation-panel {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 2px solid var(--forvia-light);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--gray-dark);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--forvia-blue);
            box-shadow: 0 0 0 3px var(--forvia-light);
        }

        .button-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 51, 204, 0.3);
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--forvia-blue);
            border: 2px solid var(--forvia-blue);
        }

        .btn-secondary:hover {
            background: var(--forvia-light);
        }

        .scope-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            border-left: 4px solid var(--forvia-blue);
        }

        .scope-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--forvia-light);
        }

        .scope-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--forvia-dark);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d1f2eb;
            color: #27AE60;
        }

        .scope-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 20px;
            background: var(--forvia-light);
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--forvia-blue);
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .functions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .functions-table thead {
            background: var(--forvia-light);
            border-bottom: 2px solid var(--forvia-blue);
        }

        .functions-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--forvia-dark);
            font-size: 13px;
            text-transform: uppercase;
        }

        .functions-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .functions-table tbody tr:hover {
            background: var(--gray-light);
        }

        .export-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--forvia-light);
        }

        .export-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-dark);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        .export-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--forvia-blue);
            background: white;
            color: var(--forvia-blue);
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .export-btn:hover {
            background: var(--forvia-light);
        }

        footer {
            background: linear-gradient(90deg, var(--forvia-blue) 0%, var(--forvia-dark) 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .button-group { flex-direction: column; }
            .page-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <i class="fas fa-cube"></i> FORVIA NRT
            </div>
            <ul class="nav-links">
                <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="/commit-analysis"><i class="fas fa-code-branch"></i> Analysis</a></li>
                <li><a href="/workitem-scope"><i class="fas fa-tasks"></i> Scope</a></li>
                <li><a href="/graph-visualization"><i class="fas fa-project-diagram"></i> Graph</a></li>
                <li><a href="/reports"><i class="fas fa-chart-bar"></i> Reports</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-title">
            <i class="fas fa-tasks"></i> WorkItem Scope Generator
        </div>

        <div class="generation-panel">
            <form id="scopeForm">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-tasks"></i> WorkItem ID</label>
                    <input type="text" id="workitemId" class="form-input" placeholder="127835" required>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn"><i class="fas fa-cogs"></i> Generate Scope</button>
                    <button type="reset" class="btn btn-secondary"><i class="fas fa-redo"></i> Clear</button>
                </div>
            </form>
        </div>

        <div id="scopeResults"></div>
    </div>

    <footer>
        <p>&copy; 2025 FORVIA NRT Scope System | <strong>Automated Non-Regression Test Orchestration</strong></p>
    </footer>

    <script>
        document.getElementById('scopeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const workitemId = document.getElementById('workitemId').value;
            
            const resultsDiv = document.getElementById('scopeResults');
            resultsDiv.innerHTML = '<div style="text-align: center; padding: 40px;"><div style="border: 4px solid var(--forvia-light); border-top: 4px solid var(--forvia-blue); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div><p>Generating scope...</p></div>';

            try {
                const response = await fetch(`/api/workitem/${workitemId}`);
                const data = await response.json();

                if (!response.ok) {
                    resultsDiv.innerHTML = `<div style="background: #f8d7da; border-left: 4px solid #E74C3C; color: #721c24; padding: 15px 20px; border-radius: 8px;"><i class="fas fa-exclamation-circle"></i> ${data.error || 'Error generating scope'}</div>`;
                    return;
                }

                displayScope(data);
            } catch (error) {
                resultsDiv.innerHTML = `<div style="background: #f8d7da; border-left: 4px solid #E74C3C; color: #721c24; padding: 15px 20px; border-radius: 8px;"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
            }
        });

        function displayScope(data) {
            const resultsDiv = document.getElementById('scopeResults');
            const functionsHtml = (data.functions || []).map(fn => `
                <tr>
                    <td><i class="fas fa-code"></i> ${fn.name || 'Unknown'}</td>
                    <td>${fn.microservice || 'N/A'}</td>
                    <td><span class="badge badge-success"><i class="fas fa-check"></i> Covered</span></td>
                </tr>
            `).join('');

            resultsDiv.innerHTML = `
                <div class="scope-card">
                    <div class="scope-header">
                        <span class="scope-title"><i class="fas fa-folder-open"></i> Generated Scope for WorkItem ${data.workitem_id}</span>
                        <span class="badge badge-success"><i class="fas fa-check-circle"></i> Complete</span>
                    </div>

                    <div class="scope-stats">
                        <div class="stat-box">
                            <div class="stat-value">${data.function_count || 0}</div>
                            <div class="stat-label">Functions</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.microservice_count || 0}</div>
                            <div class="stat-label">Microservices</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.commit_count || 0}</div>
                            <div class="stat-label">Commits</div>
                        </div>
                    </div>

                    <table class="functions-table">
                        <thead>
                            <tr>
                                <th>Function</th>
                                <th>Microservice</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${functionsHtml}
                        </tbody>
                    </table>

                    <div class="export-section">
                        <div class="export-title"><i class="fas fa-download"></i> Export Scope</div>
                        <div class="export-buttons">
                            <button class="export-btn" onclick="exportData('json')"><i class="fas fa-file-code"></i> JSON</button>
                            <button class="export-btn" onclick="exportData('csv')"><i class="fas fa-file-csv"></i> CSV</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportData(format) {
            alert(`Export as ${format.toUpperCase()} - Feature coming soon!`);
        }
    </script>
</body>
</html>
